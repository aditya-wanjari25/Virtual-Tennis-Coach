[project]
name = "tennis-coach-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mediapipe==0.10.30",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `app` and `tests.conftest` importable without installing the project
# or scattering sys.path edits through the suite.
pythonpath = ["."]
# Fixtures shell out to ffmpeg and the extraction tests run MediaPipe, so a
# slow test is expected; surface the slowest few rather than guessing.
addopts = "-q --durations=5"
